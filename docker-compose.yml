services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mynaksh-dev-password}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mynaksh-dev-password}
    ports:
      - "${APP_PORT:-8000}:8000"   # set APP_PORT if 8000 is taken
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
